<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo con esquinas redondeadas (estilo Adaptive Icon) -->
  <rect width="512" height="512" rx="110" fill="#0D1B2A" />
  
  <!-- Anillo exterior del reloj / temporizador -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00B4D8" stroke-width="24" stroke-linecap="round" />
  
  <!-- Manecillas minimalistas -->
  <line x1="256" y1="256" x2="256" y2="170" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="310" y2="256" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  
  <!-- Pequeño punto central -->
  <circle cx="256" cy="256" r="14" fill="#00B4D8" />
</svg>