name: recordapp
description: RecordApp - migración de Flet a Flutter (solo Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  go_router: ^18.0.0
  sqflite: ^2.4.1
  path: ^1.9.1
  audioplayers: ^6.1.0
  easy_localization: ^3.0.8
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.0
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/locales/
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/verdio_logo.png"
  android: true
  ios: false
  min_sdk_android: 21